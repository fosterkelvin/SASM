services:
  server:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/mern_db

  client:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - server
    env_file:
      - ./frontend/.env

  mongo:
    image: mongo
    ports:
      - "27017:27017"